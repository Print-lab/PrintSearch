[package]
name = "printsearch"
version = "0.3.0"
authors = ["Print-lab"]
edition = "2021"
description = "Unified search for 3D models (Thingiverse, Printables, MakerWorld, Thangs, Cults, MyMiniFactory)"
license = "GPL-3.0-only"
repository = "https://github.com/Print-lab/PrintSearch"
readme = "README.md"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
directories = "5"
urlencoding = "2"
axum = "0.7"
headless_chrome = "1"
open = "5"

[features]
default = ["tray"]
# Tray icon (Windows) / notification area (Linux) and start without a terminal window.
# Without it (`--no-default-features`), the application stays an ordinary terminal program.
tray = ["dep:tray-icon"]

[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
tray-icon = { version = "0.26", default-features = false, features = ["ksni"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
winresource = "0.1"

[package.metadata.deb]
maintainer = "Print-lab"
license-file = ["LICENSE", "0"]
section = "utils"
priority = "optional"
depends = "$auto"
recommends = "chromium | chromium-browser | google-chrome-stable | microsoft-edge-stable | brave-browser"
suggests = "gnome-shell-extension-appindicator"
assets = [
    ["target/release/printsearch",    "usr/bin/",                              "755"],
    ["packaging/printsearch.desktop", "usr/share/applications/",               "644"],
    ["packaging/printsearch.png",     "usr/share/icons/hicolor/256x256/apps/", "644"],
]

# Prevents Cargo from walking up to find a stray parent Cargo.toml
[workspace]
